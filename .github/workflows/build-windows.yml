# Compila GeoPhotoAI.exe y arma el paquete portable para Windows.
# - A mano: pestaña Actions → "Build Windows portable" → Run workflow (deja el .zip como artefacto).
# - Con una etiqueta v* (ej. git tag v2.1.0 && git push --tags): además publica un Release con el .zip.
name: Build Windows portable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: proyecto/proyecto_ia
    steps:
      - uses: actions/checkout@v4

      - name: Compilar GeoPhotoAI.exe (.NET Framework csc)
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "No se encontró csc.exe" }
          $icon = if (Test-Path app.ico) { "/win32icon:app.ico" } else { "" }
          & $csc /nologo /target:winexe /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll $icon /out:GeoPhotoAI.exe Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación" }
          Get-Item GeoPhotoAI.exe | Select-Object Name, Length

      - name: Prueba de humo (el .exe sirve la app en 127.0.0.1)
        run: |
          $p = Start-Process -FilePath .\GeoPhotoAI.exe -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              foreach ($port in 8080..8085) {
                try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                  if ($r.StatusCode -eq 200 -and $r.Content -match 'GeoPhoto') { $ok = $true; Write-Host "OK: puerto $port"; break }
                } catch {}
              }
              if ($ok) { break }
            }
            if (-not $ok) { throw "El .exe no respondió con la app" }
            $js = Invoke-WebRequest -Uri "http://127.0.0.1:$port/modules/ai-extract.js" -UseBasicParsing
            if ($js.StatusCode -ne 200) { throw "No sirve los módulos nuevos" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match 'msedge|chrome' } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Armar paquete portable
        run: ./scripts/package_portable.ps1

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GeoPhotoAI_Portable
          path: proyecto/proyecto_ia/GeoPhotoAI_Portable.zip
          retention-days: 30

      - name: Publicar Release (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" GeoPhotoAI_Portable.zip --title "GeoPhoto AI ${{ github.ref_name }}" --notes "Paquete portable para Windows 10/11. Descomprimir y abrir GeoPhotoAI.exe."
